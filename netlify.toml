<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 1 — Multi Level MKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F0E9; --panel:#FBFAF6; --ink:#171B20; --soft:#5C636F;
  --rule:#C6C1B1; --plot:#1B4D3E; --flag:#B4451F; --amber:#96712A;
  --display:"Instrument Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);overflow:hidden}

/* ---- gate screen ---- */
.gate{
  position:fixed;inset:0;background:var(--paper);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:28px 28px;
  display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;
}
.gate-card{max-width:400px;width:100%;text-align:center}
.gate-eyebrow{font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:16px}
.gate h1{font:400 clamp(32px,7vw,44px)/1 var(--display);margin-bottom:28px}
select{
  width:100%;font:16px/1 var(--sans);color:var(--ink);background:var(--panel);
  border:1px solid var(--rule);border-radius:2px;padding:15px 16px;margin-bottom:16px;
  appearance:none;-webkit-appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%235C636F" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat;background-position:right 16px center;
}
select:focus{outline:none;border-color:var(--plot);box-shadow:0 0 0 3px rgba(27,77,62,.12)}
.gate button{width:100%;padding:16px}
.gate-code{margin-top:14px}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:2px solid var(--ink);background:var(--paper)}
.brand{font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.studentbadge{font:600 13px/1 var(--mono);color:var(--plot);border:1px solid var(--plot);border-radius:2px;padding:7px 12px}
.chartname{font:400 20px/1 var(--display);font-style:italic;flex:1}
.timer{font:600 15px/1 var(--mono);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:8px 13px;min-width:74px;text-align:center}
.timer.warn{color:var(--flag);border-color:var(--flag)}
.wc{font:500 12px/1 var(--mono);color:var(--soft)}
.wc b{color:var(--ink)}
.wc.short b{color:var(--flag)}
.wc.ok b{color:var(--plot)}

/* ---- split layout ---- */
.split{display:flex;height:calc(100% - 57px)}
.pane{height:100%;overflow-y:auto}
.left{flex:0 0 46%;border-right:2px solid var(--ink);padding:26px 26px 40px;background:var(--panel)}
.right{flex:1;padding:26px 26px 40px;display:flex;flex-direction:column}
.tasklabel{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
.prompt-text{font-size:14.5px;line-height:1.6;margin-bottom:20px;padding:14px 16px;background:var(--paper);border-left:3px solid var(--plot)}
.chartwrap{background:#fff;border:1px solid var(--rule);border-radius:2px;padding:10px}
.chartwrap img{width:100%;height:auto;display:block}
.chart-missing{aspect-ratio:7/5;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 10px,var(--paper) 10px,var(--paper) 20px);border:1px dashed var(--rule);color:var(--soft);font:500 13px/1.5 var(--mono);text-align:center;padding:20px}

textarea{flex:1;width:100%;font:16px/1.75 var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:16px 18px;resize:none;min-height:0}
textarea:focus{outline:none;border-color:var(--plot);box-shadow:0 0 0 3px rgba(27,77,62,.12)}
:focus-visible{outline:2px solid var(--plot);outline-offset:2px}

.rowbottom{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
button{font:600 14px/1 var(--sans);background:var(--ink);color:var(--paper);border:0;border-radius:2px;padding:14px 26px;cursor:pointer;transition:background .15s,transform .05s}
button:hover:not(:disabled){background:var(--plot)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}

/* ---- overlay ---- */
.overlay{position:fixed;inset:0;background:rgba(23,27,32,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.show{opacity:1;pointer-events:auto}
.results{background:var(--paper);max-width:680px;width:100%;border:2px solid var(--ink);border-radius:2px;padding:32px 30px 34px;animation:up .25s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.rclose{background:none;color:var(--soft);border:1px solid var(--rule);padding:8px 13px;font:600 12px var(--sans)}
.rclose:hover{background:none;color:var(--ink);border-color:var(--ink)}

.plot{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-items:end;height:140px;margin-top:22px}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:2px solid var(--ink)}
.bar{background:var(--plot);width:100%;border-radius:1px 1px 0 0;transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.col .val{font:600 14px/1 var(--mono);text-align:center;padding-bottom:6px}
.axis{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:20px}
.axis span{font:500 9.5px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--soft);text-align:center;padding-top:8px}
.overall{display:flex;align-items:baseline;gap:14px;padding:16px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.overall .n{font:400 50px/.8 var(--display);color:var(--plot)}
.overall .lbl{font:600 10px/1.5 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.overall .wcnt{margin-left:auto;font:500 11px/1 var(--mono);color:var(--soft)}
.summary{margin-top:16px;font-size:15px}
.tanote{margin-top:12px;padding:11px 15px;background:var(--panel);border-left:3px solid var(--flag);font-size:13.5px}
.deliverynote{margin-top:12px;padding:9px 13px;background:var(--panel);border-left:3px solid var(--amber);font:500 12.5px/1.5 var(--mono);color:var(--soft)}

.block2{margin-top:26px}
.block2 h3{font:600 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--soft);padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.fix{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:42px 1fr;gap:13px}
.fix:last-child{border-bottom:0}
.tag{font:600 9px/1 var(--mono);letter-spacing:.05em;color:var(--flag);border:1px solid var(--flag);border-radius:2px;padding:4px 0;text-align:center;height:fit-content}
.quote{font:italic 400 15px/1.45 var(--display);margin-bottom:6px}
.quote::before{content:"“"}.quote::after{content:"”"}
.issue{font-size:13.5px;color:var(--soft);margin-bottom:7px}
.better{font:500 13.5px/1.5 var(--sans);color:var(--plot);padding-left:12px;border-left:2px solid var(--plot)}
ul.plain,ol.steps{list-style:none}
ul.plain li,ol.steps li{padding:10px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
ul.plain li:last-child,ol.steps li:last-child{border-bottom:0}
ul.plain li::before{content:"+ ";color:var(--plot);font-weight:600;font-family:var(--mono)}
ol.steps{counter-reset:s}
ol.steps li{counter-increment:s;padding-left:30px;position:relative}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:11px;font:600 11px var(--mono);color:var(--flag)}
.note{border-left:3px solid var(--flag);padding:14px 16px;background:var(--panel);font-size:14.5px}
.loading-overlay .results{text-align:center;padding:50px 30px}
.loading-overlay .spin{width:34px;height:34px;border:3px solid var(--rule);border-top-color:var(--plot);border-radius:50%;margin:0 auto 18px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-overlay p{font:500 13px var(--mono);color:var(--soft);letter-spacing:.04em}

@media (max-width:820px){
  .split{flex-direction:column;height:auto;overflow:visible}
  body{overflow:auto}
  .left{flex:none;border-right:0;border-bottom:2px solid var(--ink)}
  .right{min-height:50vh}
  textarea{min-height:280px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="roster.js"></script>
<script src="charts.js"></script>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Multi Level MKS · Task 1</div>
    <h1>Who's writing?</h1>
    <select id="nameSelect"><option value="">Select your name…</option></select>
    <input id="codeGate" class="codebox" style="width:100%;font:16px var(--mono);padding:15px 16px;border:1px solid var(--rule);border-radius:2px;background:var(--panel);margin-bottom:16px" placeholder="Access code" autocomplete="off" hidden>
    <button id="enterBtn">Begin</button>
  </div>
</div>

<div class="topbar">
  <div class="brand">Multi Level MKS</div>
  <div class="studentbadge" id="studentBadge">—</div>
  <div class="chartname" id="chartname">Loading…</div>
  <div class="wc" id="wc"><b>0</b> words</div>
  <div class="timer" id="timer">20:00</div>
</div>

<div class="split">
  <div class="pane left">
    <div class="tasklabel">Task 1</div>
    <div class="prompt-text" id="promptText">Loading task…</div>
    <div class="chartwrap" id="chartwrap">
      <div class="chart-missing" id="chartMissing">No chart image yet.<br>Add one in charts.js.</div>
      <img id="chartImg" alt="Task 1 chart" style="display:none">
    </div>
  </div>
  <div class="pane right">
    <div class="tasklabel">Your report</div>
    <textarea id="essay" placeholder="Write at least 150 words describing the chart." spellcheck="true"></textarea>
    <div class="rowbottom">
      <button id="go">Submit</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="results" id="resultsBox"></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const countWords = s => s.trim().split(/\s+/).filter(Boolean).length;

/* ── CONFIG ──────────────────────────────────── */
const REQUIRE_CODE = true;
const TIME_LIMIT_MIN = 20;
/* ─────────────────────────────────────────────── */

// --- populate name dropdown from roster.js ---
const roster = window.CLASS_ROSTER || [];
const sel = $("nameSelect");
roster.forEach(name => {
  const o = document.createElement("option");
  o.value = name; o.textContent = name;
  sel.appendChild(o);
});
if (REQUIRE_CODE) $("codeGate").hidden = false;

let currentStudent = "";
let accessCode = "";

$("enterBtn").onclick = () => {
  const name = sel.value;
  if (!name) { sel.focus(); return; }
  if (REQUIRE_CODE && !$("codeGate").value.trim()) { $("codeGate").focus(); return; }
  currentStudent = name;
  accessCode = $("codeGate").value.trim();
  $("studentBadge").textContent = name;
  $("gate").style.display = "none";
  essay.focus();
};

// --- chart selection: one per day from the bank ---
function pickChart() {
  const bank = window.CHART_BANK || [];
  if (!bank.length) return null;
  const dayIndex = Math.floor(Date.now() / 86400000);
  return bank[dayIndex % bank.length];
}
const chart = pickChart();
if (chart) {
  $("chartname").textContent = chart.title;
  $("promptText").textContent = chart.prompt;
  const img = $("chartImg");
  img.onload = () => { img.style.display = "block"; $("chartMissing").style.display = "none"; };
  img.onerror = () => { img.style.display = "none"; $("chartMissing").style.display = "flex"; $("chartMissing").textContent = `Image not found: ${chart.image}`; };
  img.src = chart.image;
} else {
  $("chartname").textContent = "No chart configured";
  $("promptText").textContent = "Add at least one entry to charts.js.";
}

// --- word counter ---
const essay = $("essay"), wc = $("wc");
essay.addEventListener("input", () => {
  const n = countWords(essay.value);
  wc.innerHTML = `<b>${n}</b> words`;
  wc.className = "wc" + (n === 0 ? "" : n < 150 ? " short" : " ok");
});

// --- timer, informational only ---
let secondsLeft = TIME_LIMIT_MIN * 60;
const timerEl = $("timer");
setInterval(() => {
  if (secondsLeft <= 0) return;
  secondsLeft--;
  const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
  timerEl.textContent = `${m}:${String(s).padStart(2,"0")}`;
  if (secondsLeft <= 120) timerEl.classList.add("warn");
}, 1000);

// --- submit ---
const overlay = $("overlay"), box = $("resultsBox"), go = $("go");

go.onclick = async () => {
  if (!currentStudent) { showNote("Select your name first."); return; }
  const text = essay.value.trim();
  if (countWords(text) < 40) { showNote("Write at least 40 words before submitting."); return; }

  go.disabled = true;
  showLoading();

  try {
    const res = await fetch("/.netlify/functions/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        essay: text,
        student: currentStudent,
        chartPrompt: chart ? chart.prompt : "",
        chartData: chart ? (chart.data || "") : "",
        chartTitle: chart ? chart.title : "",
        code: accessCode
      })
    });
    const data = await res.json();
    if (!res.ok) { showNote(data.error || "Something went wrong."); go.disabled = false; return; }
    showResults(data);
  } catch {
    showNote("No connection. Check your internet and try again.");
  }
  go.disabled = false;
};

function showLoading() {
  overlay.classList.add("show", "loading-overlay");
  box.innerHTML = `<div class="spin"></div><p>Reading your report…</p>`;
}

function showNote(msg) {
  overlay.classList.remove("loading-overlay");
  overlay.classList.add("show");
  box.innerHTML = `<div class="rtop"><div></div><button class="rclose" onclick="document.getElementById('overlay').classList.remove('show')">Close</button></div><div class="note">${esc(msg)}</div>`;
}

function showResults(d) {
  overlay.classList.remove("loading-overlay");
  overlay.classList.add("show");

  const crit = [["Task", d.ta], ["Cohesion", d.cc], ["Lexis", d.lr], ["Grammar", d.gra]];
  const bars = crit.map(([, v], i) => `<div class="col"><div class="val">${esc(v)}</div><div class="bar" style="height:${Math.max(6,(Number(v)/9)*100)}%;animation-delay:${i*80}ms"></div></div>`).join("");
  const axis = crit.map(([k]) => `<span>${esc(k)}</span>`).join("");

  const fixes = (d.fixes || []).map(f => `
    <div class="fix">
      <div class="tag">${esc(f.criterion || "—")}</div>
      <div>
        <div class="quote">${esc(f.quote)}</div>
        <div class="issue">${esc(f.issue)}</div>
        <div class="better">${esc(f.better)}</div>
      </div>
    </div>`).join("");

  const strengths = (d.strengths || []).map(s => `<li>${esc(s)}</li>`).join("");
  const steps = (d.nextSteps || []).map(s => `<li>${esc(s)}</li>`).join("");

  box.innerHTML = `
    <div class="rtop">
      <div class="brand" style="font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)">${esc(d.student)} — Result</div>
      <button class="rclose" onclick="document.getElementById('overlay').classList.remove('show')">Close</button>
    </div>
    <div class="plot">${bars}</div>
    <div class="axis">${axis}</div>
    <div class="overall">
      <span class="n">${esc(d.overall)}</span>
      <span class="lbl">Overall<br>band</span>
      <span class="wcnt">${esc(d.wordCount)} words</span>
    </div>
    ${d.summary ? `<p class="summary">${esc(d.summary)}</p>` : ""}
    ${d.taNote ? `<div class="tanote">${esc(d.taNote)}</div>` : ""}
    ${d._delivered === false ? `<div class="deliverynote">This result was not saved to the class record — show your screen to your teacher.</div>` : ""}
    ${strengths ? `<div class="block2"><h3>Holding up</h3><ul class="plain">${strengths}</ul></div>` : ""}
    ${fixes ? `<div class="block2"><h3>Corrections</h3>${fixes}</div>` : ""}
    ${steps ? `<div class="block2"><h3>Before your next report</h3><ol class="steps">${steps}</ol></div>` : ""}
  `;
}
</script>
</body>
</html>
